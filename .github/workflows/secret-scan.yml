name: Secret scanning gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks-gate:
    runs-on: ubuntu-latest
    env:
      BLOCK_AT_SEVERITY: ${{ vars.BLOCK_AT_SEVERITY || 'high' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history and enforce severity threshold
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --config=/repo/.gitleaks.toml --no-banner --no-color --log-level=fatal --redact \
            --report-format=json --report-path=- --exit-code=0 /repo \
            | python .github/scripts/evaluate_gate.py "$BLOCK_AT_SEVERITY"
